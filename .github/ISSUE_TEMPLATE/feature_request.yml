name: Feature request
description: Propose an improvement to the wrapper.
labels: [enhancement]
title: "[Feature]: "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the workflow or problem this would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired library, CLI, or REST behavior with a synthetic example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Note current workarounds and any compatibility or authentication implications.
